# Publishes this package when a version tag (v2.10.0-demo.1) is pushed, then submits the release
# to CodeRoot, where a person approves it before anyone is told to trust it.
#
# `pack` builds and tests once with the upstream pnpm setup and cannot publish. `publish` runs in
# the `npm-publish` environment, the only place npm's trusted publishing accepts, and publishes that
# exact tarball with provenance; no npm token exists. `submit` has no environment, so its identity
# token cannot publish, and hands the same tarball to CodeRoot.

name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-demo.[0-9]+"

permissions: {}

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      name: ${{ steps.pack.outputs.name }}
      version: ${{ steps.pack.outputs.version }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: ""
      - name: Exact pnpm
        run: npm install -g pnpm@9.15.9 --ignore-scripts && pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Test
        run: |
          (cd test && pnpm install --ignore-workspace --frozen-lockfile)
          pnpm test
      - run: pnpm build:all
      - id: pack
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          [ "v$version" = "$TAG" ] || { echo "tag $TAG does not match $name $version"; exit 1; }
          npm pack --ignore-scripts >/dev/null && mv ./*.tgz package.tgz
          {
            echo "name=$name"
            echo "version=$version"
            echo "sha256=$(sha256sum package.tgz | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: package.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: ""
      - name: Exact npm
        run: npm install -g npm@12.2.0 --ignore-scripts && npm --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - name: Check the tarball is the one pack built
        env:
          EXPECTED: ${{ needs.pack.outputs.sha256 }}
        run: '[ "$(sha256sum package.tgz | cut -d" " -f1)" = "$EXPECTED" ] || { echo "digest mismatch"; exit 1; }'
      # A -demo.N version is a prerelease, which npm publishes only with an explicit tag.
      - name: Publish with provenance
        run: npm publish package.tgz --registry https://registry.npmjs.org/ --access public --provenance --ignore-scripts --tag latest

  submit:
    needs: [pack, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - name: Check the tarball is the one pack built
        env:
          EXPECTED: ${{ needs.pack.outputs.sha256 }}
        run: '[ "$(sha256sum package.tgz | cut -d" " -f1)" = "$EXPECTED" ] || { echo "digest mismatch"; exit 1; }'
      # CodeRoot reads the version and its provenance from npm, which serves them minutes after the
      # upload, and npm's CDN keeps a miss for up to 60 s and the package document for up to 300 s.
      - name: Wait until npm serves the provenance
        env:
          NAME: ${{ needs.pack.outputs.name }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          set -euo pipefail
          reg=https://registry.npmjs.org
          pkg="${NAME/\//%2f}"
          deadline=$(( $(date +%s) + 900 ))
          while :; do
            code=$(curl -s -o att.json -w '%{http_code}' "$reg/-/npm/v1/attestations/$pkg@$VERSION") || true
            if [ "$code" = 200 ] && jq -e '[.attestations[]?.predicateType // ""] | any(startswith("https://slsa.dev/provenance/"))' att.json >/dev/null; then
              break
            fi
            [ "$(date +%s)" -lt "$deadline" ] || { echo "::error::npm did not serve the provenance for $NAME@$VERSION within 15 minutes (last HTTP $code)"; exit 1; }
            sleep 15
          done
          echo "npm serves the provenance for $NAME@$VERSION"
          published=$(curl -sf "$reg/$pkg" | jq -r --arg v "$VERSION" '.time[$v] // empty')
          [ -n "$published" ] || { echo "::error::npm's package document has no publish time for $VERSION"; exit 1; }
          settle=$(( $(date -d "$published" +%s) + 330 - $(date +%s) ))
          [ "$settle" -ge 75 ] || settle=75
          echo "waiting ${settle}s for npm's cached copies to expire"
          sleep "$settle"
      - name: Submit to CodeRoot
        uses: coderoot-eth/action@4367129c8915b9f6733044cb02d5a5adf8e301b3 # v1.2.0
        with:
          mode: submit
          flow: published
          artifact: package.tgz
          name: ${{ needs.pack.outputs.name }}
          version: ${{ needs.pack.outputs.version }}
